[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsegmenter-ct-gce"
version = "0.1.0"
description = "CT-GCE: Verified mathematical formulation and MLOps pipeline for multi-annotator semantic segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
training = [
    "torchvision>=0.15.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
]
tuning = [
    "optuna>=3.0.0",
]
baselines = [
    "SimpleITK>=2.3.0",
]
viz = [
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v -ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
